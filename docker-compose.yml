services:
  # Gateway mode. The Crewhu API token arrives per request on X-Crewhu-Api-Token.
  # Do not set CREWHU_API_TOKEN or env_file here — that would put a static
  # vendor credential in the container. Compose interpolates CONDUIT_S2S_SECRET
  # from the project environment. For AUTH_MODE=env, pass CREWHU_API_TOKEN on
  # that process instead (see the README).
  mcp:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=${AUTH_MODE:-gateway}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
